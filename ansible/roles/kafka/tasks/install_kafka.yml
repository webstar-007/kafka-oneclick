---
# Runs on each of the 3 brokers. Result: a running Kafka broker, all three joined in one cluster.

- name: Install Java and curl
  ansible.builtin.apt:
    name: [openjdk-17-jre-headless, curl]
    update_cache: true
  retries: 5
  delay: 10
  register: apt_result
  until: apt_result is succeeded

- name: Create the kafka user (Kafka does not run as root)
  ansible.builtin.user:
    name: kafka
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/kafka-home

- name: Download Kafka
  ansible.builtin.get_url:
    url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
    dest: /tmp/kafka.tgz
    mode: "0644"
  retries: 3
  delay: 10

- name: Unpack Kafka into /opt
  ansible.builtin.unarchive:
    src: /tmp/kafka.tgz
    dest: /opt
    remote_src: true
    creates: "/opt/kafka_{{ scala_version }}-{{ kafka_version }}"

- name: Give the kafka user the Kafka folder
  ansible.builtin.file:
    path: "/opt/kafka_{{ scala_version }}-{{ kafka_version }}"
    owner: kafka
    group: kafka
    recurse: true

- name: Short path /opt/kafka points to the installed version
  ansible.builtin.file:
    src: "/opt/kafka_{{ scala_version }}-{{ kafka_version }}"
    dest: /opt/kafka
    state: link

- name: Create the data folder (where Kafka stores messages)
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    owner: kafka
    group: kafka
    mode: "0750"

- name: Write the broker settings
  ansible.builtin.template:
    src: server.properties.j2
    dest: "/opt/kafka_{{ scala_version }}-{{ kafka_version }}/config/kraft/server.properties"
    owner: kafka
    group: kafka
    mode: "0640"
  notify: restart kafka

- name: Prepare the storage (only the first time)
  ansible.builtin.command: >
    /opt/kafka/bin/kafka-storage.sh format
    -t {{ kafka_cluster_id }}
    -c /opt/kafka/config/kraft/server.properties
    --ignore-formatted
  changed_when: false

- name: Make sure the kafka user owns the data folder
  ansible.builtin.file:
    path: "{{ kafka_data_dir }}"
    state: directory
    owner: kafka
    group: kafka
    recurse: true

- name: Install the systemd service (so Kafka starts by itself)
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: "0644"
  notify: restart kafka

- name: Apply pending restarts now (so Kafka starts once, with the final settings)
  ansible.builtin.meta: flush_handlers

- name: Start Kafka
  ansible.builtin.systemd:
    name: kafka
    enabled: true
    state: started
    daemon_reload: true

- name: Wait until this broker answers on port 9092
  ansible.builtin.wait_for:
    port: 9092
    host: "{{ ansible_default_ipv4.address }}"
    timeout: 120
